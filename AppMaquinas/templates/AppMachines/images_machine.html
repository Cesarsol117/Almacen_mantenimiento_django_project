{% extends "inicio.html" %}
{% block contenido1 %}
    <H1>fOTOS</H1>
    <div class="layout">    
        {% if images_machine %}
            {% for cada_imagen in images_machine %}
            <div>
                <p> maquina: {{ cada_imagen.machine.name }}</p>    
                <img src="{{ cada_imagen.machine_imagen.url }}" class="d-block w-100" alt="Imagen de máquina" height="250px" width="auto">
               
            </div>
         {% endfor %}
        {% else %}
            <p>No hay imágenes disponibles.</p>
        {% endif %}
    </div>

    <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">        <div class="carousel-inner">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="..." class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="..." class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="..." class="d-block w-100" alt="...">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
    </div>
    

    <a class="btn btn-danger" href="{% url 'add_machines' %}">Agregar Maquina</a>
        
            
        
   
{% endblock contenido1 %}
